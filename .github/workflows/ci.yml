name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/logsvc/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -shuffle=on -count=1 -cover ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet ./...
      - name: example
        working-directory: examples/logsvc
        run: |
          go vet ./...
          go test -race -count=1 ./...
          "$(go env GOPATH)/bin/gosec" -quiet ./...
